name: MULADDMOD research build

on:
  push:
    branches: ['feat/experimental-muladdmod']
  pull_request:
    paths:
      - '.github/workflows/muladdmod-research.yml'
      - 'crates/script/**'
      - 'crates/consensus/**'
      - 'crates/mempool/**'
      - 'crates/node/**'
      - 'bin/bitcoin-rs/**'
      - 'scripts/research/muladdmod_rpc.py'
      - 'docs/research/muladdmod.md'

permissions:
  contents: read

concurrency:
  group: muladdmod-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record source and toolchain
        run: |
          mkdir -p /tmp/muladdmod-tests
          git rev-parse HEAD > /tmp/muladdmod-tests/commit.txt
          rustc --version > /tmp/muladdmod-tests/toolchain.txt
          cargo fmt --all --check
      - name: Flag-off compatibility tests
        run: cargo test --locked -p bitcoin-rs-script 2>&1 | tee /tmp/muladdmod-tests/flag-off.txt
      - name: Arithmetic and complete Taproot witness tests
        run: cargo test --locked -p bitcoin-rs-script --features experimental-muladdmod 2>&1 | tee /tmp/muladdmod-tests/script.txt
      - name: Consensus flag and cache tests
        run: cargo test --locked -p bitcoin-rs-consensus --features experimental-muladdmod-regtest 2>&1 | tee /tmp/muladdmod-tests/consensus.txt
      - name: Mempool admission tests
        run: cargo test --locked -p bitcoin-rs-mempool --features experimental-muladdmod-regtest muladdmod 2>&1 | tee /tmp/muladdmod-tests/mempool.txt
      - name: Node engine isolation tests
        run: cargo test --locked -p bitcoin-rs-node --no-default-features --features fjall,experimental-muladdmod-regtest muladdmod 2>&1 | tee /tmp/muladdmod-tests/node.txt
      - name: Valid-prefix rejection proof
        run: cargo test --locked -p bitcoin-rs-chainstate --no-default-features --features fjall,bitcoin-rs-consensus/experimental-muladdmod-regtest a_window_with_an_invalid_middle_block_commits_only_the_valid_prefix 2>&1 | tee /tmp/muladdmod-tests/sync.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muladdmod-tests-${{ github.run_id }}
          path: /tmp/muladdmod-tests/

  regtest-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record exact build source
        run: |
          mkdir -p /tmp/muladdmod-build
          git archive --format=tar HEAD | gzip -n > /tmp/muladdmod-build/source.tar.gz
          git rev-parse HEAD > /tmp/muladdmod-build/commit.txt
          rustc --version > /tmp/muladdmod-build/toolchain.txt
      - name: Build optimized research executable
        run: |
          cargo build --locked --profile quickstart -p bitcoin-rs --no-default-features --features fjall,experimental-muladdmod-regtest 2>&1 | tee /tmp/muladdmod-build/build.txt
          cp target/quickstart/bitcoin-rs /tmp/muladdmod-build/bitcoin-rs
          target/quickstart/bitcoin-rs --version > /tmp/muladdmod-build/version.txt
          (cd /tmp/muladdmod-build && sha256sum bitcoin-rs > binary.sha256)
      - name: Real regtest admission, mining, and restart
        run: python3 scripts/research/muladdmod_rpc.py target/quickstart/bitcoin-rs --report /tmp/muladdmod-build/regtest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muladdmod-linux-x86_64-${{ github.run_id }}
          path: /tmp/muladdmod-build/
