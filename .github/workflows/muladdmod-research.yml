name: MULADDMOD research build

on:
  push:
    branches: ['feat/experimental-muladdmod']
  pull_request:
    paths:
      - '.github/workflows/muladdmod-research.yml'
      - 'crates/script/**'
      - 'docs/research/muladdmod.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Export source receipt
        run: |
          mkdir -p /tmp/muladdmod-source
          git archive --format=tar HEAD | gzip -n > /tmp/muladdmod-source/source.tar.gz
          git rev-parse HEAD > /tmp/muladdmod-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: muladdmod-source-${{ github.sha }}
          path: /tmp/muladdmod-source/
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Baseline script tests
        run: cargo test --locked -p bitcoin-rs-script
