[package]
autotests = false
name = "bitcoin-rs-nested-musig2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Experimental NestedMuSig2 signer and isolated Taproot transaction staging"

[lints]
workspace = true

[features]
default = []
conformance = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "nested-musig2"
path = "src/main.rs"

[dependencies]
bitcoin.workspace = true
bitcoin_hashes.workspace = true
clap.workspace = true
secp256k1.workspace = true
serde.workspace = true
sonic-rs.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
required-features = ["conformance"]
