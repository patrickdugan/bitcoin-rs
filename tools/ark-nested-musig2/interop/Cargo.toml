[package]
name = "arkade-interop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Derives Arkade default VTXO and boarding addresses with arkade-os/rust-sdk ark-core"

[workspace]

[[bin]]
name = "arkade-interop"
path = "src/main.rs"

[dependencies]
ark-core = { git = "https://github.com/arkade-os/rust-sdk", rev = "c786942969dd16f9e94fc165a99a329a39ed183d" }
serde_json = "1"
hex = "0.4"
thiserror = "2"
bitcoin = "0.32.7"
